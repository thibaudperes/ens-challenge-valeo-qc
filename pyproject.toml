[project]
name = "valeo-qc"
version = "0.1.0"
description = "Industrial visual quality control with drift detection for the ENS Challenge Data x Valeo"
readme = "README.md"
authors = [
    { name = "Thibaud Peres", email = "202183632+thibaudperes@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pillow>=11.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
# heavy, and only needed to run experiments: `uv sync --group train`
train = [
    "mlflow>=3.17.2",
    "timm>=1.0.0",
    "torch>=2.5.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
